name: Zig CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and fixtures
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig 0.16
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run library tests
        run: zig build test

      - name: Run html5lib tokenizer tests
        run: zig build test-html5lib
